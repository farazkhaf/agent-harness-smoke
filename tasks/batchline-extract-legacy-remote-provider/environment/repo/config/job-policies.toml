# Batchline job policy catalog
# Operational defaults for known job kinds.

[jobs.thumbnail]
owner = "media"
queue = "media"
enabled = true
priority = "normal"
worker_pool = "media-workers"
concurrency_class = "interactive"
max_attempts = 4
timeout_seconds = 120
max_runtime_seconds = 480
lease_seconds = 90
heartbeat_grace_seconds = 30
visibility_timeout_seconds = 180
rate_limit_class = "images"
backoff_policy = "exponential"
dead_letter_queue = "media-dlq"
payload_limit_kb = 512
result_ttl_seconds = 86400
idempotency_window_seconds = 3600
dedupe_window_seconds = 300
retry_policy = "standard"
trace_sample_rate = 0.1
emit_started_event = true
emit_progress_event = false
retain_failure_payload = true
audit_level = "standard"

